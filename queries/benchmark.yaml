policy:
  numeric_buffer: 0.10
  on_value_present_and_failing: exclude
  on_value_missing: keep_as_insufficient_data
  geography: registered
  
regions:
  scandinavia: &scandinavia [se, no, dk, fi, is]
  europe: &europe [al, ad, at, ba, be, bg, by, ch, cy, cz, de, dk, ee, es, fi,
                   fr, gb, gr, hr, hu, ie, is, it, li, lt, lu, lv, mc, md, me,
                   mk, mt, nl, no, pl, pt, ro, rs, se, si, sk, sm, ua, va, xk]
queries:

  - id: q01
    text: "Logistic companies in Romania"
    type: semantic
    constraints:
      - what: "sediu în România"
        how: field
        field: address.country_code
        value: [ro]
      - what: "oferă logistică ca serviciu către terți"
        how: semantic

  - id: q02
    text: "Public software companies with more than 1,000 employees."
    type: semantic
    constraints:
      - what: "companie publică"
        how: field
        field: is_public
        value: true
      - what: "peste 1000 de angajați"
        how: field
        field: employee_count
        op: ">"
        value: 1000
      - what: "produce software"
        how: semantic

  - id: q03
    text: "Food and beverage manufacturers in France"
    type: semantic
    constraints:
      - what: "sediu în Franța"
        how: field
        field: address.country_code
        value: [fr]
      - what: "produce alimente sau băuturi"
        how: semantic
      - what: "producător, nu distribuitor sau retailer"
        how: semantic

  - id: q04
    text: "Companies that could supply packaging materials for a direct-to-consumer cosmetics brand"
    type: capability
    constraints:
      - what: "produce sau furnizează ambalaje"
        how: semantic
      - what: "ambalaje potrivite pentru cosmetice"
        how: semantic
      - what: "compatibil cu un brand DTC (volume mici, personalizare)"
        how: inference
        verdict_when_unverifiable: insufficient_data

  - id: q05
    text: "Construction companies in the United States with revenue over $50 million"
    type: semantic
    constraints:
      - what: "sediu în Statele Unite"
        how: field
        field: address.country_code
        value: [us]
      - what: "venit peste 50M USD"
        how: field
        field: revenue
        op: ">"
        value: 50000000
      - what: "activitate de construcții"
        how: semantic

  - id: q06
    text: "Pharmaceutical companies in Switzerland"
    type: semantic
    constraints:
      - what: "sediu în Elveția"
        how: field
        field: address.country_code
        value: [ch]
      - what: "activitate farmaceutică"
        how: semantic

  - id: q07
    text: "B2B SaaS companies providing HR solutions in Europe"
    type: semantic
    constraints:
      - what: "model B2B"
        how: field
        field: business_model
        contains: "Business-to-Business"
      - what: "model SaaS"
        how: field
        field: business_model
        contains: "Software-as-a-Service"
      - what: "sediu în Europa"
        how: field
        field: address.country_code
        value: *europe
      - what: "oferă soluții de HR"
        how: semantic

  - id: q08
    text: "Clean energy startups founded after 2018 with fewer than 200 employees"
    type: semantic
    constraints:
      - what: "fondată după 2018"
        how: field
        field: year_founded
        op: ">"
        value: 2018
      - what: "sub 200 de angajați"
        how: field
        field: employee_count
        op: "<"
        value: 200
      - what: "energie curată"
        how: semantic
      - what: "startup"
        how: redundant

  - id: q09
    text: "Fast-growing fintech companies competing with traditional banks in Europe."
    type: capability
    constraints:
      - what: "sediu în Europa"
        how: field
        field: address.country_code
        value: *europe
      - what: "activitate fintech"
        how: semantic
      - what: "concurează cu băncile tradiționale"
        how: inference
      - what: "creștere rapidă"
        how: unsupported
        verdict_when_unverifiable: insufficient_data

  - id: q10
    text: "E-commerce companies using Shopify or similar platforms"
    type: semantic
    constraints:
      - what: "activitate de e-commerce"
        how: field
        field: business_model
        contains: "E-commerce"
      - what: "folosește Shopify sau platformă similară"
        how: unsupported
        verdict_when_unverifiable: insufficient_data

  - id: q11
    text: "Renewable energy equipment manufacturers in Scandinavia"
    type: semantic
    constraints:
      - what: "Scandinavia"
        how: field
        field: address.country_code
        value_retrieval: [se, no, dk, fi, is]
        value_strict: [se, no, dk]
      - what: "produce echipament de energie regenerabilă"
        how: semantic

  - id: q12
    text: "Companies that manufacture or supply critical components for electric vehicle battery production"
    type: capability
    constraints:
      - what: "produce sau furnizează componente"
        how: semantic
      - what: "componentele sunt critice pentru producția de baterii EV"
        how: inference